# Usage:
#   python -m models.photoz.LSTM.photoz_lstm --config path/to/config.yaml
#
# Outputs land in {save_dir}/{experiment_name}/:
#   config.yaml, scaler.pkl, best_model.pkl, checkpoint.pkl,
#   training.log, metrics_curve.jpg, test_results.txt

# ---------------------------------------------------------------
# Experiment identity
# ---------------------------------------------------------------
experiment_name: "0LSTMwithUncertainty_addLayersUnits"
random_seed: 2025
gpu_id: "0"
save_dir: "."

# ---------------------------------------------------------------
# Model
# ---------------------------------------------------------------
model_class_name: "DeepPhotozLSTMWithUncertainty"
model_params:
  input_dim: 38
  lstm_hidden_size: 32
  num_lstm_layers: 2
  fc_hidden_dims: [1024, 512, 256]
  dropout_rate: 0.2
  use_batch_norm: true
  output_activation: "relu"

# ---------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------
dataset_class_name: "Dataset_Photz"
dataset_params:
  # Feature layout for PS1-style catalogs.
  # Colors are added first, followed by magnitudes and then error columns.
  mag_types: ["Kron", "PSF", "Ap"]
  color_types: ["Kron", "Ap"]
  use_mag: true
  use_magerr: true
  use_colorerr: false
  label_noise: 0.0

dataset_mode:
  # Use one file for all rows and split by ratios:
  # type: "ratio"
  # ratios:
  #   train: 0.8
  #   val: 0.1
  #   test: 0.1
  type: "files"
  paths:
    train: "/path/to/train.fits"
    val: "/path/to/val.fits"
    test: "/path/to/test.fits"

# ---------------------------------------------------------------
# Label transform
# ---------------------------------------------------------------
# Uncomment one transform block if the model should train on a transformed
# redshift target instead of the raw ``z`` value.
#
# label_transform: "none"
#
# Option 1: log1p transform, suitable for non-negative redshifts.
# label_transform: "log1p"
# label_transform_params: {}
#
# Option 2: log transform with a configurable offset.
# label_transform: "log"
# label_transform_params:
#   offset: 1.0
#
# Option 3: square-root transform.
label_transform: "sqrt"
label_transform_params: {}
#
# Option 4: power transform.
# label_transform: "power"
# label_transform_params:
#   power: 0.5
#
# Option 5: asinh transform.
# label_transform: "asinh"
# label_transform_params:
#   scale: 1.0

# ---------------------------------------------------------------
# Training
# ---------------------------------------------------------------
batch_size: 4096
epochs: 300
early_stopping: 20
loss_type: "gaussian_nll"  # gaussian_nll | mse | huber
train_augmentation: false

# ---------------------------------------------------------------
# Optimizer
# ---------------------------------------------------------------
optimizer_config:
  name: "AdamW"
  params:
    lr: 0.0005
    weight_decay: 0.001

# ---------------------------------------------------------------
# Scheduler
# ---------------------------------------------------------------
scheduler_config:
  name: "ReduceLROnPlateau"
  params:
    mode: min
    factor: 0.5
    patience: 5
    verbose: true

# ---------------------------------------------------------------
# Gradient clipping
# ---------------------------------------------------------------
gradient_clipping:
  enabled: true
  method: "norm"
  max_norm: 1.0
