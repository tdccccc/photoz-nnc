# Run: nohup python3 photoz_ann.py --config photoz_ann_config.yaml &

experiment_name: "Mag&MagErr"
random_seed: 2025
gpu_id: '1'
save_dir: "./grizW1W2"

# Model
model_class_name: 'PhotozRegressor'
model_params:
  hidden_dims: [512, 256, 128, 64]
  dropout_rate: 0.1
  activation_function: 'relu'
  use_batch_norm: true
  use_layer_norm: false
  use_residual: true

# Dataset
dataset_class_name: 'DatasetPhotozRegression'
dataset_params:
  # LS grizW1W2
  feature_columns: [
    # Magnitudes
    'dered_mag_g', 'dered_mag_r', 'dered_mag_i',
    'dered_mag_z', 'dered_mag_w1', 'dered_mag_w2',
    # Magnitude errors
    'mag_g_Err', 'mag_r_Err', 'mag_i_Err',
    'mag_z_Err', 'mag_w1_Err', 'mag_w2_Err',
  ]

  # Label noise configuration (only applied to training data)
  label_noise:
    type: 'gaussian'  # Options: 'gaussian', 'uniform', 'relative_gaussian', 'relative_uniform'
    level: 0.0      # Noise level (0.0 = no noise)

dataset_mode:
  type: 'files'
  paths:
    # LSDR9x10 grizW1W2
    train: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_train.fits"
    val: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_val.fits"
    test: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_test.fits"

# Train
batch_size: 4096
epochs: 300
early_stopping: 20

optimizer_config:
  name: "AdamW"
  params:
    lr: 0.0005
    weight_decay: 0.00001

scheduler_config:
  name: "ReduceLROnPlateau"
  params:
    mode: min
    factor: 0.5
    patience: 5

gradient_clipping:
  enabled: true
  method: 'norm'
  max_norm: 1.0

# Loss configuration for regression
loss_config:
  type: 'huber'  # Options: 'mse', 'mae', 'huber', 'smooth_l1'
  huber_delta: 1.0  # For Huber loss (robust to outliers)
  # smooth_l1_beta: 1.0  # For Smooth L1 loss

# Notes:
# - This is for direct regression, not binned classification
# - The model outputs a single redshift value, not a distribution
# - Loss functions available:
#   * mse: Mean Squared Error - standard regression loss
#   * mae: Mean Absolute Error - less sensitive to outliers
#   * huber: Combination of MSE and MAE - robust to outliers
#   * smooth_l1: Similar to Huber but smoother
# - Evaluation metrics include: MSE, MAE, R2, NMAD, bias, outlier fraction