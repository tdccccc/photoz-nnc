# Run: nohup python3 galaxyClf_ann.py --config galaxyClf_ann_config.yaml &

experiment_name: "1NoSpec_xSpec_NoErr"
random_seed: 2025
gpu_id: '1'
save_dir: "./LSDR10/grzW1W2"

# Model
model_class_name: 'GalaxyClassifier'
model_params:
  hidden_dims: [512, 256, 128, 64]
  dropout_rate: 0.1
  activation_function: 'relu'
  use_batch_norm: true
  use_layer_norm: false
  use_residual: true

# Dataset
dataset_class_name: 'DatasetGalaxyClassification'
dataset_params:
  # Label column for binary classification (galaxy=1, others=0)
  label_column: 'label'

  # PS1DR2
  # feature_columns: [
  #   # Magnitude features
  #   'gKronMag_dered', 'rKronMag_dered', 'iKronMag_dered', 'zKronMag_dered', 'yKronMag_dered',
  #   'gPSFMag_dered', 'rPSFMag_dered', 'iPSFMag_dered', 'zPSFMag_dered', 'yPSFMag_dered',
  #   'gApMag_dered', 'rApMag_dered', 'iApMag_dered', 'zApMag_dered', 'yApMag_dered',
  #   # Magnitude errors
  #   'gKronMagErr', 'rKronMagErr', 'iKronMagErr', 'zKronMagErr', 'yKronMagErr',
  #   'gPSFMagErr', 'rPSFMagErr', 'iPSFMagErr', 'zPSFMagErr', 'yPSFMagErr',
  #   'gApMagErr', 'rApMagErr', 'iApMagErr', 'zApMagErr', 'yApMagErr',
  # ]
  # LSDR10
  feature_columns: [
    'dered_mag_g', 'dered_mag_r',
    'dered_mag_z', 'dered_mag_w1', 'dered_mag_w2',
    # 'mag_g_Err', 'mag_r_Err',
    # 'mag_z_Err', 'mag_w1_Err', 'mag_w2_Err',
  ]

dataset_mode:
  type: 'files'
  paths:
    # PS1DR2
    # train: "/home/tiandc/photoz/galaxyClf/data/PS1DR2_r_trainset_train.fits"
    # val: "/home/tiandc/photoz/galaxyClf/data/PS1DR2_r_trainset_val.fits"
    # test: "/home/tiandc/photoz/galaxyClf/data/PS1DR2_r_trainset_test.fits"
    # LSDR10
    # 'train': "/home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec/LSDR10_NoSpec_train.fits"
    # 'val': "/home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec/LSDR10_NoSpec_val.fits"
    # 'test': "/home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec/LSDR10_NoSpec_test.fits"
    # LSDR10 NoSpec_xSpec
    'train': "/home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec_xSpec/LSDR10_NoSpec_xSpec_train.fits"
    'val': "/home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec_xSpec/LSDR10_NoSpec_xSpec_val.fits"
    'test': "/home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec_xSpec/LSDR10_NoSpec_xSpec_test.fits"

# Train
batch_size: 4096
epochs: 300
early_stopping: 20

optimizer_config:
  name: "AdamW"
  params:
    lr: 0.00001
    weight_decay: 0.00001

scheduler_config:
  name: "ReduceLROnPlateau"
  params:
    mode: min
    factor: 0.5
    patience: 5

gradient_clipping:
  enabled: true
  method: 'norm'
  max_norm: 1.0

# Loss configuration for binary classification
loss_config:
  type: 'bce_logits'  # Options: 'bce', 'bce_logits', 'focal'
  # focal_alpha: 1.0    # For Focal loss (class weighting)
  # focal_gamma: 2.0    # For Focal loss (focus on hard examples)

# Notes:
# - This is for binary classification: galaxy=1, others=0
# - Loss functions available:
#   * bce: Binary Cross Entropy (requires sigmoid output)
#   * bce_logits: BCE with logits (more numerically stable, recommended)
#   * focal: Focal loss - useful for imbalanced datasets
# - Evaluation metrics include: Accuracy, Precision, Recall, F1, AUC-ROC
# - For imbalanced datasets, consider using focal loss or adjusting class weights