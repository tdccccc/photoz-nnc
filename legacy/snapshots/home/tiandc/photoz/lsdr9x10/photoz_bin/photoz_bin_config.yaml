# Run: nohup python3 photoz_bin.py --config config.yaml &

experiment_name: "NoiseScale2.0"
random_seed: 2025
gpu_id: '1'
save_dir: "./grizW1W2/testMagNoise"

# Model
model_class_name: 'PhotozBinningClassifier'
model_params:
  hidden_dims: [512, 256, 128, 64]
  dropout_rate: 0.1
  activation_function: 'relu'
  use_batch_norm: true
  use_layer_norm: false
  use_residual: true

# Dataset
dataset_class_name: 'DatasetPhotozBinned'
dataset_params:
  # Label column
  label_column: 'z'
  
  # Binning configuration
  binning_config:
    z_min: 0.0
    z_max: 2
    num_bins: 400
    soft_label_width: 0.1  # in bin units, null to disable, >1 to enable

  # Noise scale
  # noise_scale: 2.0

  # Magnitude error pairs
  # LS grizW1W2
  # mag_err_pairs: [
  #   ['dered_mag_g', 'mag_g_Err'],
  #   ['dered_mag_r', 'mag_r_Err'],
  #   ['dered_mag_i', 'mag_i_Err'],
  #   ['dered_mag_z', 'mag_z_Err'],
  #   ['dered_mag_w1', 'mag_w1_Err'],
  #   ['dered_mag_w2', 'mag_w2_Err'],
  # ]
  # PS1DR2
  # ps1_err_pairs: [
  #   ['gPSFMag_dered', 'gPSFMagErr'],
  #   ['rPSFMag_dered', 'rPSFMagErr'],
  #   ['iPSFMag_dered', 'iPSFMagErr'],
  #   ['zPSFMag_dered', 'zPSFMagErr'],
  #   ['gKronMag_dered', 'gKronMagErr'],
  #   ['rKronMag_dered', 'rKronMagErr'],
  #   ['iKronMag_dered', 'iKronMagErr'],
  #   ['zKronMag_dered', 'zKronMagErr'],
  #   ['gApMag_dered', 'gApMagErr'],
  #   ['rApMag_dered', 'rApMagErr'],
  #   ['iApMag_dered', 'iApMagErr'],
  #   ['zApMag_dered', 'zApMagErr'],
  #   # unWISE 
  #   ['mag_w1', 'mag_w1_Err'],
  #   ['mag_w2', 'mag_w2_Err'],
  # ]

  # Feature columns
  # LS grizW1W2
  feature_columns: [
    # Magnitudes
    'dered_mag_g', 'dered_mag_r', 'dered_mag_i',
    'dered_mag_z', 'dered_mag_w1', 'dered_mag_w2',
    # Magnitude errors
    'mag_g_Err', 'mag_r_Err', 'mag_i_Err',
    'mag_z_Err', 'mag_w1_Err', 'mag_w2_Err',
    # Color
    # 'g_r', 'r_i', 'i_z', 'z_w1', 'w1_w2',
  ]
  # LS grzW1W2
  # feature_columns: [
  #   # Magnitudes
  #   'dered_mag_g', 'dered_mag_r', 
  #   'dered_mag_z', 'dered_mag_w1', 'dered_mag_w2',
  #   # Magnitude errors
  #   'mag_g_Err', 'mag_r_Err',
  #   'mag_z_Err', 'mag_w1_Err', 'mag_w2_Err',
  # ]
  # LSDR9x10 grzW1W2 + PS1DR2 i
  # feature_columns: [
  #   # Magnitudes
  #   'dered_mag_g', 'dered_mag_r',
  #   'dered_mag_z', 'dered_mag_w1', 'dered_mag_w2',
  #   # Magnitude errors
  #   'mag_g_Err', 'mag_r_Err', 
  #   'mag_z_Err', 'mag_w1_Err', 'mag_w2_Err',
  #   # PS1DR2 i
  #   'iPSFMag_dered', 'iKronMag_dered', 'iApMag_dered',
  #   'iPSFMagErr', 'iKronMagErr', 'iApMagErr',
  # ]


dataset_mode:
  type: 'files'
  paths:
    # LSDR9x10 grizW1W2
    train: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_train.fits"
    val: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_val.fits"
    test: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_test.fits"
    # LSDR9x10 grzW1W2
    # train: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_train.fits"
    # val: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_val.fits"
    # test: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_test.fits"
    # LSDR9x10 grizW1W2 DESI only
    # train: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_train_DESIonly_train.fits"
    # val: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_train_DESIonly_val.fits"
    # LSDR9x10 grizW1W2 SDSS only
    # train: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_train_SDSSonly_train.fits"
    # val: "/home/tiandc/photoz/lsdr9x10/data/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_i_train_SDSSonly_val.fits"
    # LSDR9x10 (all) grzW1W2 + PS1DR2 i 
    # train: "/home/tiandc/photoz/lsdr9x10/data/LSDR9x10xPS1DR2/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_xPS1DR2Photi_train.fits"
    # val: "/home/tiandc/photoz/lsdr9x10/data/LSDR9x10xPS1DR2/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_xPS1DR2Photi_val.fits"
    # test: "/home/tiandc/photoz/lsdr9x10/data/LSDR9x10xPS1DR2/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_xPS1DR2Photi_test.fits"
    # LSDR9x10 (only grz) grzW1W2 + PS1DR2 i 
    # train: "/home/tiandc/photoz/lsdr9x10/data/LSDR9x10xPS1DR2/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_xPS1DR2Photi_grz_train.fits"
    # val: "/home/tiandc/photoz/lsdr9x10/data/LSDR9x10xPS1DR2/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_xPS1DR2Photi_grz_val.fits"
    # test: "/home/tiandc/photoz/lsdr9x10/data/LSDR9x10xPS1DR2/DESIDR1_xSDSSDR19_xlsdr9x10Phot_clean_xPS1DR2Photi_grz_test.fits"

# Train
batch_size: 4096
epochs: 300
early_stopping: 20

optimizer_config:
  name: "AdamW"
  params:
    lr: 0.0001
    weight_decay: 0.0001

scheduler_config:
  name: "ReduceLROnPlateau"
  params:
    mode: min
    factor: 0.5
    patience: 5

gradient_clipping:
  enabled: true
  method: 'norm'
  max_norm: 0.5

loss_config:
  type: 'crps'  # 'kl_divergence', 'weighted_kl', 'focal', 'crps', 'anchor', 'emd', 'combined'
  # bin_weights:
  #   enabled: false
  #   method: 'inverse_frequency'  # 'inverse_frequency', 'balanced', 'sqrt_inverse'
  # sample_weights:
  #   enabled: false
  # focal:
  #   alpha: 1.0
  #   gamma: 2.0
  # anchor:  # Anchor loss (Ryou et al. 2019, Lee & Shin 2021)
  #   gamma: 0.5   # Modulation strength, 0=CE, typical: 0.2, 0.5, 1.0
  #   slack: 0.05  # Margin to prevent gradient vanishing
  #   anchor: 'neg'  # 'neg' (max non-target prob) or 'pos' (target prob)
  # Combined loss: mix multiple losses with z-dependent weights
  # combined:
  #   components:  # List of loss components with weights
  #     - type: 'kl'       # 'kl', 'crps', 'emd', 'focal', 'anchor', 'brier'
  #       weight: 0.5
  #     - type: 'crps'
  #       weight: 0.5
  #     - type: 'focal'
  #       weight: 0.2
  #       params:
  #         alpha: 1.0
  #         gamma: 2.0
  #   entropy_reg: 0.1  # Entropy regularization (>0 encourages smoother distributions)
  #   z_weights:  # Redshift-dependent sample weights
  #     enabled: false
  #     ranges:  # Define weight for each redshift range
  #       - z_min: 0.0
  #         z_max: 0.3
  #         weight: 1.0
  #       - z_min: 0.3
  #         z_max: 0.6
  #         weight: 1.5  # Higher weight for mid-z range
  #       - z_min: 0.6
  #         z_max: 1.2
  #         weight: 2.0  # Higher weight for high-z (fewer samples)

# sampling_config:
#   balanced_sampling:
#     enabled: false
#     bins: 10
#     z_min: 0.0
#     z_max: 1.2

# PIT (Probability Integral Transform) monitoring
pit_config:
  enabled: true               # 是否在训练时计算 PIT
  monitor_interval: 10         # 每 N 个 epoch 计算一次 PIT
  n_bins: 20                  # PIT 直方图的 bin 数
  plot: true                  # 是否保存 PIT 诊断图
  plot_interval: 20           # 每 N 个 epoch 保存一次 PIT 图

# Temperature scaling calibration - 训练后独立进行
# 使用方法:
#   model = PhotozBinInference('model_dir/')
#   model.calibrate('validation.fits', save_path='calibrator')  # 校准并保存
#   model.load_calibrator('calibrator.pkl')  # 或加载已有校准器
#   result = model.predict('test.fits')  # 预测时自动应用校准