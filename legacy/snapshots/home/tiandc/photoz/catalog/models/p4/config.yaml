config_path: photoz_bin_config.yaml
save_dir: ./DESIDR1_xSDSSDR19_addunWISE
experiment_name: Mag&MagErr
random_seed: 2025
gpu_id: '0'
model_params:
  hidden_dims:
  - 512
  - 256
  - 128
  - 64
  dropout_rate: 0.1
  activation_function: relu
  use_batch_norm: true
  use_layer_norm: false
  use_residual: true
model_class_name: PhotozBinningClassifier
dataset_params:
  binning_config:
    z_min: 0.0
    z_max: 2
    num_bins: 400
    soft_label_width: 0.1
  feature_columns:
  - gKronMag_dered
  - rKronMag_dered
  - iKronMag_dered
  - zKronMag_dered
  - yKronMag_dered
  - gPSFMag_dered
  - rPSFMag_dered
  - iPSFMag_dered
  - zPSFMag_dered
  - yPSFMag_dered
  - gApMag_dered
  - rApMag_dered
  - iApMag_dered
  - zApMag_dered
  - yApMag_dered
  - gKronMagErr
  - rKronMagErr
  - iKronMagErr
  - zKronMagErr
  - yKronMagErr
  - gPSFMagErr
  - rPSFMagErr
  - iPSFMagErr
  - zPSFMagErr
  - yPSFMagErr
  - gApMagErr
  - rApMagErr
  - iApMagErr
  - zApMagErr
  - yApMagErr
  - mag_w1
  - mag_w2
  - mag_w1_err
  - mag_w2_err
dataset_class_name: DatasetPhotozBinned
dataset_mode:
  type: files
  paths:
    train: /home/tiandc/photoz/panstarrs/data/xunWISE/DESIDR1_xSDSSDR19_xps1dr2phot_clean_train_xunWISEphot.fits
    val: /home/tiandc/photoz/panstarrs/data/xunWISE/DESIDR1_xSDSSDR19_xps1dr2phot_clean_val_xunWISEphot.fits
    test: /home/tiandc/photoz/panstarrs/data/xunWISE/DESIDR1_xSDSSDR19_xps1dr2phot_clean_test_xunWISEphot.fits
optimizer_config:
  name: AdamW
  params:
    lr: 0.0005
    weight_decay: 1.0e-05
scheduler_config:
  name: ReduceLROnPlateau
  params:
    mode: min
    factor: 0.5
    patience: 5
batch_size: 4096
epochs: 300
early_stopping: 20
gradient_clipping:
  enabled: true
  method: norm
  max_norm: 1.0
loss_config:
  type: crps
sampling_config:
  balanced_sampling:
    enabled: false
    bins: 10
    z_min: 0.0
    z_max: 1.2
pit_config:
  enabled: true
  monitor_interval: 10
  n_bins: 20
  plot: true
  plot_interval: 20
