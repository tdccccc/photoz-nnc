config_path: galaxyClf_ann_config.yaml
save_dir: ./LSDR10/grzW1W2
experiment_name: 0NoSpec
random_seed: 2025
gpu_id: '1'
model_params:
  hidden_dims:
  - 512
  - 256
  - 128
  - 64
  dropout_rate: 0.1
  activation_function: relu
  use_batch_norm: true
  use_layer_norm: false
  use_residual: true
model_class_name: GalaxyClassifier
dataset_params:
  label_column: label
  feature_columns:
  - dered_mag_g
  - dered_mag_r
  - dered_mag_z
  - dered_mag_w1
  - dered_mag_w2
  - mag_g_Err
  - mag_r_Err
  - mag_z_Err
  - mag_w1_Err
  - mag_w2_Err
dataset_class_name: DatasetGalaxyClassification
dataset_mode:
  type: files
  paths:
    train: /home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec/LSDR10_NoSpec_train.fits
    val: /home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec/LSDR10_NoSpec_val.fits
    test: /home/tiandc/photoz/galaxyClf/data/LSDR10/NoSpec/LSDR10_NoSpec_test.fits
optimizer_config:
  name: AdamW
  params:
    lr: 1.0e-05
    weight_decay: 1.0e-05
scheduler_config:
  name: ReduceLROnPlateau
  params:
    mode: min
    factor: 0.5
    patience: 5
batch_size: 4096
epochs: 300
early_stopping: 20
gradient_clipping:
  enabled: true
  method: norm
  max_norm: 1.0
loss_config:
  type: bce_logits
