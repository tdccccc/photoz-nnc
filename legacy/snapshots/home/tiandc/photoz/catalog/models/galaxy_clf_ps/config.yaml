config_path: galaxyClf_ann_config.yaml
save_dir: ./exp
experiment_name: 1Allgri
random_seed: 2025
gpu_id: '1'
model_params:
  hidden_dims:
  - 512
  - 256
  - 128
  - 64
  dropout_rate: 0.1
  activation_function: relu
  use_batch_norm: true
  use_layer_norm: false
  use_residual: true
model_class_name: GalaxyClassifier
dataset_params:
  label_column: label
  feature_columns:
  - gKronMag_dered
  - rKronMag_dered
  - iKronMag_dered
  - zKronMag_dered
  - yKronMag_dered
  - gPSFMag_dered
  - rPSFMag_dered
  - iPSFMag_dered
  - zPSFMag_dered
  - yPSFMag_dered
  - gApMag_dered
  - rApMag_dered
  - iApMag_dered
  - zApMag_dered
  - yApMag_dered
  - gKronMagErr
  - rKronMagErr
  - iKronMagErr
  - zKronMagErr
  - yKronMagErr
  - gPSFMagErr
  - rPSFMagErr
  - iPSFMagErr
  - zPSFMagErr
  - yPSFMagErr
  - gApMagErr
  - rApMagErr
  - iApMagErr
  - zApMagErr
  - yApMagErr
dataset_class_name: DatasetGalaxyClassification
dataset_mode:
  type: files
  paths:
    train: /home/tiandc/photoz/galaxyClf/data/PS1DR2_gri_trainset_train.fits
    val: /home/tiandc/photoz/galaxyClf/data/PS1DR2_gri_trainset_val.fits
    test: /home/tiandc/photoz/galaxyClf/data/PS1DR2_gri_trainset_test.fits
optimizer_config:
  name: AdamW
  params:
    lr: 1.0e-05
    weight_decay: 1.0e-05
scheduler_config:
  name: ReduceLROnPlateau
  params:
    mode: min
    factor: 0.5
    patience: 5
batch_size: 4096
epochs: 300
early_stopping: 20
gradient_clipping:
  enabled: true
  method: norm
  max_norm: 1.0
loss_config:
  type: bce_logits
